[project]
name = "activescheduler"
version = "0.1.0"
authors = [
  {name = "Keith Eberlin", email = "keith.eberlin.uk@gmail.com"}
]
maintainers = [
  {name = "Keith Eberlin", email = "keith.eberlin.uk@gmail.com"}
]
description = "Python event-driven active scheduler framework inspired by Symbian's active scheduler model."
readme = "README.md"
requires-python = ">= 3.10"
keywords = ["RTOS", "symbian", "messaging", "event-driven", "signalling", "multi-threading", "Kafka", "RabbitMQ"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
